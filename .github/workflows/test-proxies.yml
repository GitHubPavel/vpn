name: Test VPN Proxies

# Запускается вручную — кнопкой "Run workflow" (в вебе или в приложении GitHub Mobile)
# При запуске нужно выбрать источник конфигов из списка (или вставить свою ссылку).
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Источник списка конфигов"
        required: true
        default: "sub1"
        type: choice
        options:
          - sub1
          - vless_universal
          - custom_url
      custom_url:
        description: "Своя ссылка (используется, только если source = custom_url)"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install xray-core
        run: |
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          mkdir -p xray-bin
          unzip -o xray.zip -d xray-bin
          chmod +x xray-bin/xray

      - name: Install Python dependencies
        run: |
          pip install "requests[socks]"
          pip install playwright
          playwright install --with-deps chromium

      - name: Download configs list
        run: |
          case "${{ inputs.source }}" in
            sub1)
              URL="https://raw.githubusercontent.com/barry-far/V2ray-config/main/Sub1.txt"
              ;;
            vless_universal)
              URL="https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt"
              ;;
            custom_url)
              URL="${{ inputs.custom_url }}"
              ;;
          esac
          echo "Скачиваю: $URL"
          curl -L -o configs.txt "$URL"
          echo "Строк в файле: $(wc -l < configs.txt)"

      - name: Run proxy tests
        run: python proxy_tester.py configs.txt --xray "$(pwd)/xray-bin/xray" --out results.csv

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results.csv
          retention-days: 7
