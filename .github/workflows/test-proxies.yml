name: Test VPN Proxies

permissions:
  contents: write   # нужно, чтобы шаг ниже мог закоммитить winner.txt обратно в репозиторий

# Запускается вручную — кнопкой "Run workflow" (в вебе или в приложении GitHub Mobile)
# Перед запуском можно выбрать источник конфигов.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Источник списка конфигов"
        required: true
        default: "vless_universal"
        type: choice
        options:
          - vless_universal
          - sub1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install xray-core
        run: |
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          mkdir -p xray-bin
          unzip -o xray.zip -d xray-bin
          chmod +x xray-bin/xray

      - name: Install Python dependencies
        run: |
          pip install "requests[socks]" playwright
          playwright install --with-deps chromium

      - name: Resolve source URL
        id: source
        run: |
          case "${{ inputs.source }}" in
            vless_universal)
              echo "url=https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt" >> "$GITHUB_OUTPUT"
              ;;
            sub1)
              echo "url=https://raw.githubusercontent.com/barry-far/V2ray-config/main/Sub1.txt" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Run proxy tests
        env:
          SUB_URL: ${{ steps.source.outputs.url }}
        run: python proxy_tester.py --sub-url "$SUB_URL" --xray "$(pwd)/xray-bin/xray" --out results.csv --workers 10

      - name: Write summary
        run: python generate_summary.py results.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Extract winning configs (top 5)
        run: python extract_winner.py results.csv winners.txt winners_sub.txt

      - name: Publish winners files
        run: |
          if [ ! -s winners.txt ] || [ ! -s winners_sub.txt ]; then
            echo "Рабочих конфигов нет — файлы не созданы, коммит пропущен"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add winners.txt winners_sub.txt
          if ! git diff --staged --quiet; then
            git commit -m "Update top-5 winner configs [skip ci]"
            git push
          else
            echo "Файлы не изменились — коммит не нужен"
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results.csv
          retention-days: 7
